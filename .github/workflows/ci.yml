name: PHARMVERS AIOS CI — Core Engine Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-core-engines:
    name: Run Mathematical Engine Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run PHARMVERS Verification Suite (11 Tests)
        run: python3 run_tests.py

      - name: Upload GxP Validation Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gxp-validation-report
          path: pharmvers_core/validation_report.txt
